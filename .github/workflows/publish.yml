name: Publish Instagram posts

on:
  schedule:
    - cron: "*/15 * * * *"        # GitHub may start it a few minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish what's due
        env:
          LIVE: ${{ vars.LIVE }}
          LIVE_ACCOUNTS: ${{ vars.LIVE_ACCOUNTS }}
          IG_IT_TOKEN: ${{ secrets.IG_IT_TOKEN }}
          IG_IT_USER_ID: ${{ secrets.IG_IT_USER_ID }}
          IG_EN_TOKEN: ${{ secrets.IG_EN_TOKEN }}
          IG_EN_USER_ID: ${{ secrets.IG_EN_USER_ID }}
        run: python3 publish.py
      - name: Record what was published
        if: always()
        run: |
          if ! git diff --quiet published.json 2>/dev/null || [ -n "$(git status --porcelain published.json)" ]; then
            git config user.name "publisher"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add published.json
            git commit -m "Published posts"
            git push
          fi
